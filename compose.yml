# Docker Compose configuration for Estonian data pipeline
# Services: PostgreSQL database + Python data loader
# 
# Quick start:
#   docker compose up -d --build
#   docker compose ps
#   docker compose exec db psql -U projekt -d ilm_surm_liiklus

services:
  # ========================================================================
  # PostgreSQL Database Service (pgDuckDB variant)
  # ========================================================================
  db:
    # Image: pgDuckDB 18 with PostGIS-like functionality
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: ilm-db
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Override specific environment variables for PostgreSQL
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    # Expose PostgreSQL port to host machine
    ports:
      - "5432:5432"
    
    # Persist database data in named volume
    volumes:
      # Database files stored in pgdata volume (survives container restarts)
      - pgdata:/var/lib/postgresql
      # Optional: SQL initialization scripts (uncomment to use)
      # - ./init:/docker-entrypoint-initdb.d
    
    # Health check: verify database is ready before dependent services start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  # ========================================================================
  # Python Data Loader Service
  # ========================================================================
  # This service downloads data from Estonian APIs and imports into database
  python:
    # Build image from scripts/Dockerfile
    build: ./scripts
    container_name: ilm-python
    
    # Wait for database to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
    
    # Set working directory inside container
    working_dir: /app
    
    # Pass database connection parameters to Python scripts
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # entrypoint.sh runs automatically and executes all download scripts

  # ========================================================================
  # dbt Transformation Service
  # ========================================================================
  dbt:
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    container_name: ilm-dbt
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    working_dir: /usr/app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DBT_DB_HOST: db
      DBT_DB_PORT: 5432
      DBT_DB_SCHEMA: public
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - .:/usr/app
    command: ["--version"]
    restart: "no"
    profiles: ["dbt"]


    # ========================================================================
  # Superset metadata database
  # ========================================================================
  superset-db:
    image: postgres:16
    container_name: ilm-superset-db
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: ${SUPERSET_DB_NAME}
    volumes:
      - superset_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER} -d ${SUPERSET_DB_NAME}"]
      interval: 5s
      retries: 10

  # ========================================================================
  # Superset initialization: migrations + admin user
  # ========================================================================
  superset-init:
    build:
      context: .
      dockerfile: docker/superset.Dockerfile
    container_name: ilm-superset-init
    depends_on:
      superset-db:
        condition: service_healthy
    volumes:
      - ./superset_config.py:/app/superset_config.py
      - superset_home:/app/superset_home
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_URI: "postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@superset-db:5432/${SUPERSET_DB_NAME}"
      SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    command:
      - /bin/sh
      - -c
      - "superset db upgrade && superset fab create-admin --username $${ADMIN_USERNAME} --firstname Project --lastname Admin --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} || true && superset init"

  # ========================================================================
  # Superset web application
  # ========================================================================
  superset:
    build:
      context: .
      dockerfile: docker/superset.Dockerfile
    container_name: ilm-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
    volumes:
      - ./superset_config.py:/app/superset_config.py
      - superset_home:/app/superset_home
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_URI: "postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@superset-db:5432/${SUPERSET_DB_NAME}"
      SECRET_KEY: ${SUPERSET_SECRET_KEY}
    command: ["/app/docker/entrypoints/run-server.sh"]
  # ========================================================================
  # Pipeline Orchestrator: Coordinates data download → seed → transform
  # ========================================================================
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: ilm-orchestrator
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DBT_DB_HOST: db
      DBT_DB_PORT: 5432
      DBT_DB_SCHEMA: public
      DBT_PROFILES_DIR: /app
    restart: unless-stopped

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  pgdata:
  superset_db:
  superset_home:
